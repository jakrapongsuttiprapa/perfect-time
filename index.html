var R = {};
R.mc = function(q, host, ready, rng){
  var ord = shuffle(range(q.o.length), rng), sel = -1, locked = false;
  var top = '';
  if (q.t === 'dlg') top = '<div class="dlg">' + q.d.map(function(l){ return '<div class="bub ' + (l[0] === 'A' ? 'A' : 'B') + '"><b>' + esc(l[0] === 'A' ? 'SPEAKER A' : 'SPEAKER B') + '</b>' + fmtQ(l[1]) + '</div>'; }).join('') + '</div>';
  if (q.t === 'tl') top = '<div class="tlwrap">' + tlSVG(q.tl, q.lab) + '</div>';
  host.innerHTML = top + (q.q ? '<div class="qtext">' + fmtQ(q.q) + '</div>' : '') + '<div class="opts">' + ord.map(function(oi, k){ return '<button class="opt" data-k="' + k + '"><span class="k">' + 'ABCD'[k] + '</span><span>' + esc(q.o[oi]) + '</span></button>'; }).join('') + '</div>';
  var btns = $$('.opt', host);
  btns.forEach(function(b){ b.onclick = function(){ if (locked) return; sel = Number(b.dataset.k); btns.forEach(function(x){ x.classList.toggle('sel', x === b); }); SFX.click(); ready(true); }; });
  return {
    grade:function(){ return {ok:ord[sel] === q.a, given:sel >= 0 ? q.o[ord[sel]] : ''}; },
    lock:function(){ locked = true; btns.forEach(function(b){ b.disabled = true; }); },
    reveal:function(){ this.lock(); btns.forEach(function(b){ var k = Number(b.dataset.k); if (ord[k] === q.a) b.classList.add('right'); else if (k === sel) b.classList.add('wrong'); }); }
  };
};
R.dlg = R.mc; R.tl = R.mc; R.voc = R.mc;
R.bank = function(q, host, ready, rng){
  var parts = String(q.q).split('___'), nb = parts.length - 1, fill = [], focus = 0, locked = false;
  for (var i = 0; i < nb; i++) fill.push(-1);
  var chips = shuffle(range(q.o.length), rng);
  var html = '<div class="qtext">'; parts.forEach(function(p, i){ html += esc(p); if (i < nb) html += '<span class="slot" data-s="' + i + '">ช่อง ' + (i + 1) + '</span>'; }); html += '</div>';
  html += '<div class="chips-pool">' + chips.map(function(ci){ return '<button class="chip" data-c="' + ci + '">' + esc(q.o[ci]) + '</button>'; }).join('') + '</div>';
  host.innerHTML = html;
  var slots = $$('.slot', host), cbs = $$('.chip', host);
  function draw(){
    slots.forEach(function(s, i){ s.classList.toggle('filled', fill[i] >= 0); s.classList.toggle('focus', i === focus && !locked); s.textContent = fill[i] >= 0 ? q.o[fill[i]] : 'ช่อง ' + (i + 1); });
    cbs.forEach(function(c){ c.classList.toggle('used', fill.indexOf(Number(c.dataset.c)) >= 0); });
    ready(fill.every(function(v){ return v >= 0; }));
  }
  slots.forEach(function(s){ s.onclick = function(){ if (locked) return; var i = Number(s.dataset.s); if (fill[i] >= 0) fill[i] = -1; focus = i; SFX.click(); draw(); }; });
  cbs.forEach(function(c){ c.onclick = function(){ if (locked) return; var ci = Number(c.dataset.c); if (fill.indexOf(ci) >= 0) return; fill[focus] = ci; var nx = fill.indexOf(-1); focus = nx >= 0 ? nx : focus; SFX.click(); burst(c, '#22d3ee'); draw(); }; });
  draw();

    grade:function(){ var given = fill.map(function(f){ return f >= 0 ? q.o[f] : ''; }); return {ok:given.every(function(g, i){ return g === q.a[i]; }), given:given.join(' / ')}; },
    lock:function(){ locked = true; cbs.forEach(function(c){ c.disabled = true; }); draw(); },
    reveal:function(){ this.lock(); slots.forEach(function(s, i){ s.classList.add(q.o[fill[i]] === q.a[i] ? 'right' : 'wrong'); }); }

R.order = function(q, host, ready, rng){

    pl.innerHTML = pool.map(function(t, k){ return '<button class="chip" data-p="' + k + '">' + esc(q.w[t]) + '</button>'; }).join('') || '<span class="ph" style="color:var(--dim)">ครบแล้ว ✓</span>';
    $$('[data-a]', line).forEach(function(b){ b.onclick = function(){ if (locked) return; var k = Number(b.dataset.a); pool.push(ans.splice(k, 1)[0]); SFX.click(); draw(); }; });

R.sort = function(q, host, ready, rng){
  var place = q.it.map(function(){ return -1; }), order = shuffle(range(q.it.length), rng), pick = -1, locked = false;
  host.innerHTML = '<div class="qtext" style="font-size:20px">' + esc(q.q) + '</div><div class="chips-pool" data-bin="-1" id="spool"></div><div class="bins">' + q.bins.map(function(b, i){ return '<div class="bin" data-bin="' + i + '"><h4>' + esc(b) + '</h4></div>'; }).join('') + '</div>';

  function draw(){
    poolEl.innerHTML = order.filter(function(i){ return place[i] === -1; }).map(chipHTML).join('') || '<span style="color:var(--dim)">จัดครบแล้ว ✓ (แตะบัตรเพื่อย้าย)</span>';

    lock:function(){ locked = true; pick = -1; draw(); $$('.chip', host).forEach(function(c){ c.disabled = true; }); },

          applySettings(publicOf(r.settings)); APP.setver = r.setver; SFX.ok(); toast('บันทึกการตั้งค่าแล้ว ✓', 'ok'); });
      };
    });
  }
};
function publicOf(s){ var o = {}; for (var k in s) if (k !== 'pin' && k !== 'faceCode') o[k] = s[k]; return o; }
function cssId(k){ return String(k).replace(/[^a-zA-Z0-9_-]/g, '_'); }
function downloadCSV(name, rows){
  var csv = '﻿' + rows.map(function(r){ return r.map(function(c){ c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function prepImage(file){
  return new Promise(function(res, rej){
    var rd = new FileReader();
    rd.onerror = rej;
    rd.onload = function(){
      var dataUrl = rd.result;
      if (file.type === 'image/gif' && file.size < 3e6) return res({mime:'image/gif', data:dataUrl.split(',')[1]});
      var im = new Image();
      im.onerror = function(){ res({mime:file.type, data:dataUrl.split(',')[1]}); };
      im.onload = function(){
        var max = 1920, w = im.width, h = im.height, sc = Math.min(1, max / Math.max(w, h));
        if (sc === 1 && file.size < 900000) return res({mime:file.type, data:dataUrl.split(',')[1]});
        var cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
        var g = cv.getContext('2d'), png = file.type === 'image/png' && file.size < 2e6;
        if (!png){ g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height); }
        g.drawImage(im, 0, 0, cv.width, cv.height);
        var out = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .86);
        res({mime:png ? 'image/png' : 'image/jpeg', data:out.split(',')[1]});
      };
      im.src = dataUrl;
    };
    rd.readAsDataURL(file);
  });
}

/* ================= FX LAYER ================= */
function fxOn(){ return !document.body.classList.contains('lowfx') && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }
function fxCorrect(el, streak){
  var t = document.createElement('div'); t.className = 'screen-tint ok'; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 750);
  if (!fxOn()) return;
  var r = el.getBoundingClientRect(), sh = document.createElement('div'); sh.className = 'shock';
  sh.style.left = (r.left + r.width / 2) + 'px'; sh.style.top = (r.top + r.height / 2) + 'px'; document.body.appendChild(sh); setTimeout(function(){ sh.remove(); }, 850);
  var words = ['PERFECT!', 'EXCELLENT!', 'AMAZING!', 'BRILLIANT!', 'SUPERB!'], st = document.createElement('div');
  st.className = 'stamp' + (streak >= 3 ? ' combo' : '');
  st.innerHTML = streak >= 3 ? '🔥 COMBO x' + streak + '<small>ON FIRE!</small>' : words[Math.floor(Math.random() * words.length)];
  document.body.appendChild(st); setTimeout(function(){ st.remove(); }, 1150);
  if (window.FX) FX.warp(350, 9);
}
function fxWrong(){
  var t = document.createElement('div'); t.className = 'screen-tint no'; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 750);
  var q = document.querySelector('.qcard'); if (q && fxOn()){ q.classList.remove('glitch'); void q.offsetWidth; q.classList.add('glitch'); }
}
function countdown(){
  if (!fxOn()) return;
  var d = document.createElement('div'); d.className = 'countdown'; document.body.appendChild(d);
  var seq = ['3', '2', '1', 'GO!'], i = 0;
  (function step(){
    if (i >= seq.length){ d.remove(); if (window.FX) FX.warp(700); return; }
    d.innerHTML = '<b>' + seq[i] + '</b>'; try { (seq[i] === 'GO!' ? SFX.win : SFX.click)(); } catch(e){}
    i++; setTimeout(step, 620);
  })();
}

/* fireworks on the confetti canvas */
var Fireworks = (function(){
  var cv = document.createElement('canvas'); cv.style.cssText = 'position:fixed;inset:0;z-index:49;pointer-events:none'; document.body.appendChild(cv); var g = cv.getContext('2d'), rockets = [], sparks = [], until = 0, raf = null, last = 0;
  var COLORS = ['#ff4fd8', '#7c5cff', '#22d3ee', '#ffd166', '#2ee59d', '#ffffff'];
  function launch(){ rockets.push({x:innerWidth * (.15 + Math.random() * .7), y:innerHeight + 10, vy:-(innerHeight * .016 + Math.random() * 4), c:COLORS[Math.floor(Math.random() * COLORS.length)], ty:innerHeight * (.15 + Math.random() * .3)}); }
  function boom(x, y, c){ var n = document.body.classList.contains('lite') ? 40 : 70 + Math.floor(Math.random() * 40); for (var i = 0; i < n; i++){ var a = Math.random() * 6.283, v = Math.random() * 6 + 1.5; sparks.push({x:x, y:y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:1, c:Math.random() < .2 ? '#fff' : c}); } }
  function step(t){
    if (cv.width !== innerWidth) { cv.width = innerWidth; cv.height = innerHeight; }
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'lighter';
    if (Date.now() < until && t - last > 320){ launch(); last = t; }
    rockets = rockets.filter(function(r){ r.y += r.vy; r.vy *= .985; g.fillStyle = r.c; g.beginPath(); g.arc(r.x, r.y, 3, 0, 6.283); g.fill(); if (r.y <= r.ty || r.vy > -1.5){ boom(r.x, r.y, r.c); return false; } return true; });
    sparks = sparks.filter(function(s){ s.x += s.vx; s.y += s.vy; s.vy += .07; s.vx *= .985; s.vy *= .985; s.life -= .014; g.globalAlpha = Math.max(0, s.life); g.fillStyle = s.c; g.fillRect(s.x, s.y, 2.6, 2.6); g.globalAlpha = 1; return s.life > 0; });
    if (rockets.length || sparks.length || Date.now() < until) raf = requestAnimationFrame(step); else { raf = null; g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, cv.width, cv.height); }
  }
  return { stop:function(){ until = 0; rockets = []; sparks = []; }, show:function(ms){ if (!fxOn()) return; cv.width = innerWidth; cv.height = innerHeight; until = Date.now() + (ms || 3000); if (!raf) raf = requestAnimationFrame(step); } };
})();

/* cursor glow + sparkles (mouse/trackpad only) */
