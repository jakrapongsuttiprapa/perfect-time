<!DOCTYPE html>
<html lang="th" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#07061a">
<title>PERFECT TIME QUEST · By T.OAT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#07061a;--bg2:#0e0b2b;--ink:#f5f3ff;--muted:#aaa6d6;--dim:#6f6a9c;
  --c1:#ff4fd8;--c2:#7c5cff;--c3:#22d3ee;--gold:#ffd166;--ok:#2ee59d;--bad:#ff5c7a;--warn:#ffb547;
  --glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.13);
  --r:22px;--sh:0 20px 60px -20px rgba(0,0,0,.7);
  --font:"Segoe UI","Noto Sans Thai","Leelawadee UI","Sukhumvit Set","Thonburi",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:hidden}
body{font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
a{color:var(--c3)}

/* ---------- background FX ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
#bgimg.on{opacity:.28}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(70px);opacity:.75}
.blobs i{position:absolute;width:48vmax;height:48vmax;border-radius:50%;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:radial-gradient(circle,#7c5cff 0,transparent 65%);left:-12vmax;top:-14vmax}
.blobs i:nth-child(2){background:radial-gradient(circle,#ff4fd8 0,transparent 65%);right:-16vmax;top:8vmax;animation-duration:32s;animation-delay:-8s}
.blobs i:nth-child(3){background:radial-gradient(circle,#22d3ee 0,transparent 65%);left:18vmax;bottom:-24vmax;animation-duration:38s;animation-delay:-14s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.15)}100%{transform:translate(-4vmax,8vmax) scale(.95)}}
.grid-floor{position:fixed;left:-50%;right:-50%;bottom:-10vh;height:45vh;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(124,92,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.35) 1px,transparent 1px);
  background-size:60px 60px;transform:perspective(500px) rotateX(62deg);transform-origin:top;
  mask-image:linear-gradient(to bottom,transparent,#000 40%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%,transparent);
  animation:floor 6s linear infinite;opacity:.45}
@keyframes floor{to{background-position:0 60px,0 0}}
body.lowfx .blobs,body.lowfx .grid-floor,body.lowfx #fx{display:none}
body.lowfx *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

#app{position:relative;z-index:2;min-height:100vh}
.screen{min-height:100vh;padding:22px 18px 110px;max-width:1180px;margin:0 auto;animation:scrIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- common ---------- */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.grad-text{background:linear-gradient(92deg,#fff 0%,#ffd6f6 25%,var(--c1) 45%,var(--c3) 70%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:16px;font-weight:800;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;box-shadow:0 10px 30px -8px rgba(255,79,216,.6),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed;transform:none}
.btn:disabled::after{display:none}
.btn.ghost{background:var(--glass2);box-shadow:none;border:1px solid var(--line)}
.btn.ghost::after{display:none}
.btn.cyan{background:linear-gradient(135deg,#0ea5e9,var(--c3));box-shadow:0 10px 30px -8px rgba(34,211,238,.6)}
.btn.gold{background:linear-gradient(135deg,#ff9f1c,var(--gold));color:#2a1600;box-shadow:0 10px 30px -8px rgba(255,209,102,.6)}
.btn.green{background:linear-gradient(135deg,#10b981,var(--ok));color:#03251a}
.btn.red{background:linear-gradient(135deg,#e11d48,var(--bad))}
.btn.sm{padding:8px 14px;border-radius:12px;font-size:14px}
.btn.xs{padding:5px 10px;border-radius:10px;font-size:13px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--glass2);border:1px solid var(--line)}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.5);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);outline:none;transition:border .2s,box-shadow .2s}
.input:focus{border-color:var(--c3);box-shadow:0 0 0 4px rgba(34,211,238,.18)}
select.input option{background:#151133}

/* ---------- loader ---------- */
#scr-load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.portal{width:150px;height:150px;position:relative}
.portal i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--c1);border-right-color:var(--c3);animation:spin 1.4s linear infinite}
.portal i:nth-child(2){inset:18px;border-top-color:var(--gold);border-left-color:var(--c2);animation-duration:1.9s;animation-direction:reverse}
.portal i:nth-child(3){inset:38px;border-bottom-color:var(--c3);border-left-color:var(--c1);animation-duration:1.1s}
.portal b{position:absolute;inset:58px;border-radius:50%;background:radial-gradient(circle,#fff,var(--c1) 40%,transparent 70%);animation:pulse 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.6}}

/* ---------- hero / login ---------- */
.hero{position:relative;overflow:hidden;padding:42px 28px 34px;text-align:center;border-radius:32px;margin-bottom:22px;isolation:isolate}
.hero .himg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;opacity:.55}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0%,rgba(124,92,255,.35),transparent 60%),linear-gradient(180deg,rgba(7,6,26,.2),rgba(7,6,26,.75))}
.clock{width:min(240px,58vw);height:min(240px,58vw);margin:0 auto 6px;position:relative}
.clock svg{width:100%;height:100%;overflow:visible}
.clock .r1{animation:spin 30s linear infinite;transform-origin:120px 120px}
.clock .r2{animation:spin 18s linear infinite reverse;transform-origin:120px 120px}
.clock .hand{transform-origin:120px 120px;animation:spin 8s linear infinite}
.clock .hand2{transform-origin:120px 120px;animation:spin 60s linear infinite}
.logo-img{position:absolute;inset:26%;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 40px rgba(255,79,216,.6)}
.brand{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:700}
h1.title{font-size:clamp(34px,7vw,72px);line-height:1.02;margin:8px 0 6px;font-weight:900;letter-spacing:-1px;text-shadow:0 0 40px rgba(255,79,216,.25)}
.subtitle{color:#d9d5ff;font-size:clamp(14px,2.4vw,18px);font-weight:600}
.marquee{margin:18px auto 0;max-width:720px;overflow:hidden;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line);padding:8px 0;white-space:nowrap}
.marquee span{display:inline-block;padding-left:100%;animation:mq 18s linear infinite;font-weight:700;color:var(--gold)}
@keyframes mq{to{transform:translateX(-100%)}}
.topics-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.step-title{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;margin:6px 4px 14px}
.step-title .n{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));font-size:16px}
.cls-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.cls-btn{padding:22px 10px;border-radius:22px;font-size:28px;font-weight:900;text-align:center;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.cls-btn small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.cls-btn:hover{transform:translateY(-4px)}
.cls-btn.on{background:linear-gradient(135deg,rgba(124,92,255,.55),rgba(255,79,216,.45));border-color:rgba(255,255,255,.4);box-shadow:0 0 0 2px rgba(255,79,216,.6),0 20px 40px -10px rgba(255,79,216,.5)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.name-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-align:left;transition:transform .15s,background .2s;animation:pop .35s both}
.name-btn:hover{transform:translateX(4px);background:rgba(255,255,255,.12)}
.name-btn .no{min-width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,rgba(34,211,238,.35),rgba(124,92,255,.35))}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.footer{text-align:center;color:var(--dim);font-size:13px;margin-top:30px}
.footer button{color:var(--dim);font-weight:700;text-decoration:underline dotted}

/* ---------- hub ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:12px 16px}
.me{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.avatar{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:900;background:conic-gradient(from 180deg,var(--c1),var(--c2),var(--c3),var(--c1));box-shadow:0 0 22px rgba(124,92,255,.6)}
.me b{font-size:17px}.me small{display:block;color:var(--muted)}
.topic-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:26px 4px 12px;flex-wrap:wrap}
.topic-head h2{margin:0;font-size:clamp(20px,3.4vw,28px);font-weight:900}
.topic-head .tag{font-size:12px;letter-spacing:3px;color:var(--c3);font-weight:800}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mcard{position:relative;border-radius:26px;overflow:hidden;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-align:left;
  transition:transform .25s,box-shadow .25s;transform-style:preserve-3d;isolation:isolate;border:1px solid var(--line);animation:pop .5s both}
.mcard .cover{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;transition:transform .6s}
.mcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,6,26,.05) 0%,rgba(7,6,26,.55) 50%,rgba(7,6,26,.95) 100%)}
.mcard:hover{box-shadow:0 30px 60px -20px var(--mc,#7c5cff)}
.mcard:hover .cover{transform:scale(1.08)}
.mcard .ico{position:absolute;top:16px;left:16px;font-size:34px;width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border:1px solid var(--line)}
.mcard .ring{position:absolute;top:14px;right:14px;width:64px;height:64px}
.mcard h3{margin:0;font-size:22px;font-weight:900}
.mcard p{margin:4px 0 12px;color:#d9d5ff;font-size:14px}
.mcard .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mcard .go{margin-left:auto}
.exam-card{margin-top:28px;border-radius:30px;padding:26px;position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border:1px solid rgba(255,209,102,.4)}
.exam-card .cover{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:.5}
.exam-card{border:0;background:#120a1c}
.exam-card::before{content:"";position:absolute;inset:2px;border-radius:28px;z-index:-1;background:linear-gradient(110deg,rgba(40,20,0,.9),rgba(60,20,80,.78) 60%,rgba(7,6,26,.72)),#120a1c}
.exam-card::after{content:"";position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;z-index:-3;background:conic-gradient(from 0deg,var(--gold),var(--c1),var(--c3),var(--gold));animation:spin 6s linear infinite}
.exam-card .cover{inset:2px;border-radius:28px}
.exam-card h2{margin:4px 0;font-size:clamp(24px,4vw,38px);font-weight:900}
.exam-card .tag{color:var(--gold);letter-spacing:3px;font-weight:800;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:640px){.exam-card{grid-template-columns:1fr}}
.resume-bar{margin:0 0 16px;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:rgba(255,181,71,.6)}

/* ---------- play ---------- */
.playbar{position:sticky;top:10px;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.playbar .ttl{font-weight:900;flex:1;min-width:150px}
.playbar .ttl small{display:block;color:var(--muted);font-weight:600}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;width:100%;order:9}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c3),var(--c2),var(--c1));box-shadow:0 0 18px var(--c1);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px;padding:6px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.timer.low{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.vpill{background:rgba(255,92,122,.18);border-color:rgba(255,92,122,.5);color:#ffc2cf}
.streak{font-weight:900;color:var(--gold)}
.qcard{padding:26px clamp(16px,4vw,38px) 30px;position:relative;animation:qIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes qIn{from{opacity:0;transform:translateX(40px) rotateY(-8deg)}to{opacity:1;transform:none}}
.qtype{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qtype .tbadge{padding:6px 12px;border-radius:10px;font-weight:800;font-size:13px;background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(124,92,255,.3));border:1px solid var(--line)}
.lv{color:var(--gold);letter-spacing:2px;font-size:14px}
.qnum{margin-left:auto;font-weight:900;color:var(--muted)}
.qtext{font-size:clamp(19px,2.8vw,26px);font-weight:700;line-height:1.55;margin:4px 0 20px}
.qtext .blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--c3);margin:0 4px;text-align:center;color:var(--c3)}
.hint{color:var(--muted);font-size:14px;margin:-10px 0 16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;text-align:left;font-size:18px;font-weight:600;background:var(--glass);border:2px solid var(--line);transition:transform .15s,border-color .2s,background .2s;position:relative;overflow:hidden}
.opt .k{min-width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:rgba(255,255,255,.1)}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:rgba(34,211,238,.6)}
.opt.sel{border-color:var(--c3);background:rgba(34,211,238,.14);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
.opt.sel .k{background:var(--c3);color:#04131a}
.opt.right{border-color:var(--ok)!important;background:rgba(46,229,157,.16)!important}
.opt.right .k{background:var(--ok);color:#03251a}
.opt.wrong{border-color:var(--bad)!important;background:rgba(255,92,122,.16)!important;animation:shake .4s}
.opt.wrong .k{background:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dlg{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.bub{max-width:85%;padding:12px 16px;border-radius:18px;font-size:18px;font-weight:600;animation:pop .4s both}
.bub b{display:block;font-size:12px;letter-spacing:2px;color:var(--muted)}
.bub.A{align-self:flex-start;background:rgba(124,92,255,.22);border:1px solid rgba(124,92,255,.5);border-bottom-left-radius:4px}
.bub.B{align-self:flex-end;background:rgba(255,79,216,.18);border:1px solid rgba(255,79,216,.45);border-bottom-right-radius:4px;animation-delay:.15s}
.tlwrap{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:18px}
.tlwrap svg{width:100%;height:auto;display:block}
.chips-pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:12px;border-radius:18px;background:rgba(0,0,0,.22);border:1px dashed var(--line)}
.chip{padding:11px 16px;border-radius:14px;font-weight:700;font-size:17px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.22);transition:transform .15s,opacity .2s;touch-action:none;user-select:none;-webkit-user-select:none}
.chip:hover{transform:translateY(-2px)}
.chip.used{opacity:.25;pointer-events:none}
.chip.pick{outline:3px solid var(--gold);box-shadow:0 0 20px rgba(255,209,102,.5)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:150px;min-height:44px;padding:6px 12px;margin:2px 4px;border-radius:12px;border:2px dashed var(--c3);color:var(--c3);vertical-align:middle;font-weight:800;transition:all .2s}
.slot.filled{border-style:solid;background:rgba(34,211,238,.15);color:#fff;cursor:pointer}
.slot.focus{box-shadow:0 0 0 4px rgba(255,209,102,.35);border-color:var(--gold)}
.slot.right{border-color:var(--ok);background:rgba(46,229,157,.18)}
.slot.wrong{border-color:var(--bad);background:rgba(255,92,122,.18)}
.typein{display:inline-block;width:min(330px,80vw);padding:8px 14px;margin:4px;border-radius:12px;border:2px solid var(--c3);background:rgba(0,0,0,.35);font-size:20px;font-weight:800;outline:none;vertical-align:middle;text-align:center}
.typein.right{border-color:var(--ok);background:rgba(46,229,157,.15)}
.typein.wrong{border-color:var(--bad);background:rgba(255,92,122,.15)}
.spotline{display:flex;flex-wrap:wrap;gap:10px;font-size:21px;font-weight:700}
.spot{padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--glass);transition:all .15s}
.spot:hover:not(:disabled){border-color:var(--warn)}
.spot.sel{border-color:var(--warn);background:rgba(255,181,71,.18);box-shadow:0 0 0 4px rgba(255,181,71,.15)}
.spot.right{border-color:var(--ok);background:rgba(46,229,157,.16)}
.spot.wrong{border-color:var(--bad);background:rgba(255,92,122,.16)}
.fixnote{margin-top:14px;padding:12px 16px;border-radius:14px;background:rgba(46,229,157,.12);border:1px solid rgba(46,229,157,.4);font-weight:700}
.answer-line{min-height:64px;padding:12px;border-radius:18px;border:2px solid rgba(34,211,238,.5);background:rgba(34,211,238,.07);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.answer-line .ph{color:var(--dim)}
.answer-line.right{border-color:var(--ok)}.answer-line.wrong{border-color:var(--bad)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:620px){.bins{grid-template-columns:1fr}}
.bin{min-height:150px;border-radius:20px;padding:12px;border:2px dashed rgba(255,255,255,.25);background:rgba(0,0,0,.2);transition:all .2s;display:flex;flex-direction:column;gap:8px}
.bin h4{margin:0 0 4px;font-size:15px;text-align:center;padding:8px;border-radius:12px}
.bin:nth-child(1) h4{background:rgba(124,92,255,.35)}.bin:nth-child(2) h4{background:rgba(255,79,216,.3)}
.bin.hot{border-color:var(--gold);background:rgba(255,209,102,.1);transform:scale(1.01)}
.bin .chip{font-size:15px;text-align:left}
.chip.right{border-color:var(--ok);background:rgba(46,229,157,.2)}
.chip.wrong{border-color:var(--bad);background:rgba(255,92,122,.2)}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.05);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.actbar{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:18px;flex-wrap:wrap}
.fb{margin-top:18px;padding:18px 20px;border-radius:20px;animation:fbIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fbIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.fb.ok{background:linear-gradient(135deg,rgba(46,229,157,.22),rgba(34,211,238,.12));border:1px solid rgba(46,229,157,.5)}
.fb.no{background:linear-gradient(135deg,rgba(255,92,122,.22),rgba(124,92,255,.12));border:1px solid rgba(255,92,122,.5)}
.fb h4{margin:0 0 6px;font-size:20px}
.fb .ans{font-weight:800;color:var(--gold)}
.burst{position:fixed;z-index:60;pointer-events:none;width:8px;height:8px;border-radius:50%}

/* ---------- result ---------- */
.result{text-align:center;padding:30px 20px}
.bigring{width:min(260px,70vw);height:min(260px,70vw);margin:10px auto;position:relative}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(46px,10vw,70px);font-weight:900}
.bigring .val small{display:block;font-size:16px;color:var(--muted);font-weight:700}
.stars{font-size:44px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;animation:starIn .6s both}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:20px 0;text-align:left}
.breakdown .b{padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.breakdown .bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.breakdown .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),var(--c1))}
.review{text-align:left;margin-top:18px}
.review .rv{padding:14px 16px;border-radius:16px;background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.3);margin-bottom:10px}
.review .rv .c{color:var(--ok);font-weight:800}
#confetti{position:fixed;inset:0;z-index:50;pointer-events:none}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:120;background:rgba(4,3,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;padding:26px;border-radius:28px;background:linear-gradient(160deg,#1b1546,#0d0a25);border:1px solid rgba(255,255,255,.18);box-shadow:0 40px 100px -20px #000;animation:mIn .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 10px;font-size:24px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.rules{margin:10px 0;padding-left:20px;color:#ddd9ff}
.rules li{margin:6px 0}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--c1)}
.warn-modal .modal{border-color:var(--bad);background:linear-gradient(160deg,#3a0f22,#160818)}

/* ---------- face scan ---------- */
.scan{position:relative;width:min(300px,76vw);aspect-ratio:1;margin:12px auto;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.2);background:#000}
.scan video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.scan .beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--c3),transparent);box-shadow:0 0 18px var(--c3);animation:beam 2s ease-in-out infinite}
@keyframes beam{0%,100%{top:8%}50%{top:90%}}
.scan-ring{position:absolute;inset:-10px;pointer-events:none}
.scan-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.scan-wrap{position:relative;width:min(320px,80vw);margin:0 auto}
.scan-msg{text-align:center;font-weight:800;min-height:26px;margin-top:6px}

/* ---------- chat ---------- */
.chat-fab{position:fixed;left:18px;bottom:18px;z-index:70;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:800;
  background:linear-gradient(135deg,#0ea5e9,var(--c2));box-shadow:0 12px 30px -8px rgba(34,211,238,.7)}
.chat-fab .dot{min-width:22px;height:22px;border-radius:99px;background:var(--bad);display:grid;place-items:center;font-size:12px;padding:0 6px;animation:pulse 1s infinite}
.chat-panel{position:fixed;left:18px;bottom:80px;z-index:71;width:min(380px,calc(100vw - 36px));height:min(480px,70vh);display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#1b1546,#0d0a25);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 80px -20px #000;animation:mIn .35s}
.chat-head{padding:14px 16px;background:linear-gradient(135deg,rgba(14,165,233,.4),rgba(124,92,255,.4));font-weight:800;display:flex;align-items:center;gap:8px}
.chat-head button{margin-left:auto;font-size:20px}
.chat-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:15px;word-wrap:break-word;white-space:pre-wrap}
.msg small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.msg.T{align-self:flex-start;background:rgba(124,92,255,.3);border-bottom-left-radius:4px}
.msg.S{align-self:flex-end;background:rgba(34,211,238,.25);border-bottom-right-radius:4px}
.msg.bc{align-self:center;background:rgba(255,209,102,.18);border:1px solid rgba(255,209,102,.4);text-align:center}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-in input{flex:1}
.popmsg .modal{border-color:rgba(34,211,238,.6);text-align:center}
.popmsg .from{display:inline-flex;align-items:center;gap:10px;font-weight:800;color:var(--c3);font-size:18px}
.popmsg .bigmsg{font-size:22px;font-weight:700;margin:16px 0;padding:18px;border-radius:18px;background:rgba(124,92,255,.2);white-space:pre-wrap;word-wrap:break-word}
.bell{display:inline-block;font-size:40px;animation:ring 1s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(25deg)}40%{transform:rotate(-22deg)}60%{transform:rotate(15deg)}80%{transform:rotate(-8deg)}}

/* ---------- toast & violation ---------- */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:12px 20px;border-radius:14px;font-weight:800;background:#1d1748;border:1px solid var(--line);box-shadow:var(--sh);animation:tIn .35s;pointer-events:auto;max-width:90vw}
.toast.err{border-color:var(--bad);background:#3a0f22}.toast.ok{border-color:var(--ok);background:#0b3324}
@keyframes tIn{from{opacity:0;transform:translateY(-14px)}}
.vflash{position:fixed;inset:0;z-index:150;pointer-events:none;box-shadow:inset 0 0 0 8px var(--bad),inset 0 0 120px rgba(255,92,122,.6);animation:vf 1.2s forwards}
@keyframes vf{to{opacity:0}}
.fs-block{position:fixed;inset:0;z-index:160;background:rgba(10,3,10,.92);display:grid;place-items:center;text-align:center;padding:20px}

/* ---------- admin ---------- */
#admin{position:fixed;inset:0;z-index:90;background:radial-gradient(ellipse at top,#1a1250,#07061a 60%);overflow:auto}
.adm-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(7,6,26,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.adm-top h2{margin:0;font-size:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:9px 14px;border-radius:12px;font-weight:800;background:var(--glass);border:1px solid var(--line);position:relative}
.tab.on{background:linear-gradient(135deg,var(--c2),var(--c1));border-color:transparent}
.tab .dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--bad);font-size:11px;display:grid;place-items:center;padding:0 5px}
.adm-body{padding:18px;max-width:1500px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.stat b{display:block;font-size:28px;font-weight:900}
.stat small{color:var(--muted);font-weight:700}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .input{width:auto;min-width:160px;padding:10px 14px}
.tbl-wrap{overflow:auto;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
.tbl th{position:sticky;top:0;background:#16113a;text-align:left;padding:10px;font-size:13px;color:var(--muted);z-index:1}
.tbl td{padding:9px 10px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.04)}
.tbl tr.flash td{animation:rowflash 1.6s}
@keyframes rowflash{0%,40%{background:rgba(255,92,122,.35)}}
.st{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.st.off{background:rgba(255,255,255,.08);color:var(--dim)}
.st.on{background:rgba(34,211,238,.2);color:#9ff0ff}
.st.exam{background:rgba(255,209,102,.22);color:var(--gold)}
.st.done{background:rgba(46,229,157,.2);color:#9dffd6}
.st.warn{background:rgba(255,92,122,.25);color:#ffc2cf}
.vbad{color:var(--bad);font-weight:900}
.alerts{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.alert{padding:8px 12px;border-radius:12px;background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.35);font-size:14px;animation:pop .3s}
.alert.msg{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.35)}
.adm-chat{display:grid;grid-template-columns:300px 1fr;gap:14px;height:calc(100vh - 150px);min-height:420px}
@media(max-width:800px){.adm-chat{grid-template-columns:1fr;height:auto}}
.convs{overflow:auto;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.2);padding:8px}
.conv{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;text-align:left}
.conv:hover,.conv.on{background:rgba(255,255,255,.08)}
.conv .u{margin-left:auto;background:var(--bad);border-radius:99px;font-size:12px;padding:1px 8px;font-weight:800}
.thread{display:flex;flex-direction:column;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.2);overflow:hidden;min-height:420px}
.thread .chat-body{min-height:300px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.quick button{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--glass2);border:1px solid var(--line)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.set{padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.set h4{margin:0 0 4px}.set p{margin:0 0 10px;color:var(--muted);font-size:13px}
.switch{position:relative;width:58px;height:32px;display:inline-block;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15);transition:.25s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:4px;top:4px;border-radius:50%;background:#fff;transition:.25s}
.switch input:checked+span{background:linear-gradient(135deg,var(--ok),var(--c3))}
.switch input:checked+span::before{transform:translateX(26px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.slotbox{padding:12px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.slotbox .pv{height:110px;border-radius:12px;background:rgba(0,0,0,.35) center/cover no-repeat;display:grid;place-items:center;color:var(--dim);font-size:13px;margin:8px 0}
.slotbox h5{margin:0;font-size:14px}.slotbox small{color:var(--muted)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.libimg{border-radius:14px;overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:12px}
.libimg .pv{height:100px;background:center/cover no-repeat}
.libimg .a{display:flex;gap:4px;padding:6px;flex-wrap:wrap}
.drop{border:2px dashed rgba(34,211,238,.6);border-radius:18px;padding:22px;text-align:center;background:rgba(34,211,238,.06);transition:.2s}
.drop.hot{background:rgba(34,211,238,.18)}
.faceimg{width:44px;height:33px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.demo-banner{cursor:pointer;position:fixed;right:14px;bottom:14px;z-index:60;font-size:12px;padding:8px 12px;border-radius:12px;background:rgba(255,181,71,.18);border:1px solid rgba(255,181,71,.5);color:#ffe2b3;max-width:260px}
.guide h4{margin:14px 0 6px;color:var(--c3)}
.guide table{width:100%;border-collapse:collapse;font-size:14px}
.guide td,.guide th{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.guide th{background:rgba(124,92,255,.25)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ================= FX LAYER: "grand" visuals ================= */
/* ---- intro cinematic ---- */
#intro{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(20,10,60,.2),rgba(3,2,12,.92) 70%);cursor:pointer;overflow:hidden}
#intro .i-rings{position:absolute;width:min(70vmin,560px);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%)}
#intro .i-rings i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--c1);border-bottom-color:var(--c3);animation:iRing 2.6s cubic-bezier(.2,.8,.2,1) both,spin 2s linear infinite;box-shadow:0 0 40px rgba(255,79,216,.35),inset 0 0 40px rgba(34,211,238,.25)}
#intro .i-rings i:nth-child(2){inset:12%;border-top-color:var(--gold);border-left-color:var(--c2);animation-delay:.15s,0s;animation-direction:normal,reverse}
#intro .i-rings i:nth-child(3){inset:26%;border-right-color:var(--c3);border-left-color:var(--c1);animation-delay:.3s,0s}
#intro .i-rings b{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c1) 25%,var(--c2) 50%,transparent 70%);animation:iCore 2.6s ease-in-out both;filter:blur(2px)}
@keyframes iRing{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes iCore{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
#intro .i-txt{position:relative;text-align:center;z-index:2}
#intro .i-title{font-size:clamp(34px,8vw,96px);font-weight:900;letter-spacing:-1px;line-height:1}
#intro .i-title span{display:inline-block;opacity:0;animation:iLetter .9s cubic-bezier(.2,1.4,.3,1) both;animation-delay:calc(.6s + var(--i)*.05s);
  background:linear-gradient(180deg,#fff 20%,#ffc6f3 55%,var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,79,216,.7)) drop-shadow(0 4px 0 rgba(124,92,255,.8))}
@keyframes iLetter{0%{opacity:0;transform:translateY(-120px) scale(2.4) rotateX(90deg);filter:blur(12px)}100%{opacity:1;transform:none}}
#intro .i-sub{margin-top:16px;letter-spacing:8px;font-weight:800;color:var(--gold);opacity:0;animation:fadeUp .8s 1.7s both;text-transform:uppercase;font-size:clamp(11px,1.8vw,16px)}
#intro .i-skip{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:var(--dim);font-size:13px;animation:blink 1.6s infinite}
#intro.out{animation:iOut .7s ease-in forwards}
#intro.out .i-txt{animation:iZoom .7s ease-in forwards}
@keyframes iOut{0%{background-color:rgba(255,255,255,0)}25%{background-color:rgba(255,255,255,.9)}100%{opacity:0;background-color:rgba(255,255,255,0)}}
@keyframes iZoom{to{transform:scale(3);opacity:0;filter:blur(10px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---- screen warp flash ---- */
.warp-flash{position:fixed;inset:0;z-index:95;pointer-events:none;background:radial-gradient(circle at center,rgba(255,255,255,.55),rgba(124,92,255,.25) 30%,transparent 65%);animation:wf .55s ease-out forwards}
@keyframes wf{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:0;transform:scale(1.6)}}

/* ---- cursor glow ---- */
#cursorGlow{position:fixed;left:0;top:0;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(124,92,255,.22),rgba(255,79,216,.08) 40%,transparent 70%);transition:opacity .4s;will-change:transform}
.spark{position:fixed;z-index:400;pointer-events:none;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--c1);animation:spk .8s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* ---- hero upgrades ---- */
.hero{transform-style:preserve-3d}
.hero .aurora{position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:.55;mix-blend-mode:screen;
  background:conic-gradient(from 0deg at 50% 50%,transparent 0deg,rgba(255,79,216,.35) 40deg,transparent 80deg,rgba(34,211,238,.3) 150deg,transparent 200deg,rgba(124,92,255,.4) 260deg,transparent 320deg);
  animation:spin 22s linear infinite;filter:blur(30px)}
.hero .beams{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.hero .beams i{position:absolute;bottom:-20%;width:2px;height:140%;background:linear-gradient(to top,transparent,rgba(255,255,255,.5),transparent);transform-origin:bottom;opacity:.0;animation:beam2 7s ease-in-out infinite}
.hero .beams i:nth-child(1){left:18%;--r:-18deg;animation-delay:0s}.hero .beams i:nth-child(2){left:38%;--r:-6deg;animation-delay:1.4s;background:linear-gradient(to top,transparent,rgba(255,79,216,.6),transparent)}
.hero .beams i:nth-child(3){left:62%;--r:7deg;animation-delay:2.8s;background:linear-gradient(to top,transparent,rgba(34,211,238,.6),transparent)}.hero .beams i:nth-child(4){left:82%;--r:16deg;animation-delay:4.2s}
@keyframes beam2{0%,100%{opacity:0;transform:rotate(var(--r)) scaleY(.6)}40%{opacity:.9;transform:rotate(calc(var(--r)*-1)) scaleY(1)}}
.glyphs{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glyphs span{position:absolute;white-space:nowrap;font-weight:900;font-size:clamp(12px,1.6vw,18px);color:rgba(255,255,255,.13);letter-spacing:1px;animation:glyph linear infinite;text-shadow:0 0 12px rgba(124,92,255,.5)}
@keyframes glyph{from{transform:translateY(40px) rotate(-4deg);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateY(-260px) rotate(4deg);opacity:0}}
.orbit-wrap{position:relative;width:min(300px,70vw);height:min(300px,70vw);margin:0 auto 6px;display:grid;place-items:center;perspective:700px}
.orbit-wrap .clock{margin:0}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.18);transform-style:preserve-3d;pointer-events:none}
.orbit.o1{transform:rotateX(72deg) rotateY(8deg);animation:orb1 9s linear infinite}
.orbit.o2{inset:-8%;transform:rotateX(72deg) rotateY(-30deg);border-color:rgba(255,79,216,.25);animation:orb2 14s linear infinite}
.orbit::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle,#fff,var(--c3));box-shadow:0 0 18px var(--c3),0 0 40px var(--c3)}
.orbit.o2::before{background:radial-gradient(circle,#fff,var(--c1));box-shadow:0 0 18px var(--c1),0 0 40px var(--c1);width:10px;height:10px}
@keyframes orb1{from{transform:rotateX(72deg) rotateY(8deg) rotateZ(0)}to{transform:rotateX(72deg) rotateY(8deg) rotateZ(360deg)}}
@keyframes orb2{from{transform:rotateX(72deg) rotateY(-30deg) rotateZ(360deg)}to{transform:rotateX(72deg) rotateY(-30deg) rotateZ(0)}}
.clock-halo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(255,79,216,.35),transparent 65%);animation:pulse 3s ease-in-out infinite;pointer-events:none}
h1.title.fx-title{background:none;-webkit-background-clip:initial;background-clip:initial;color:inherit;animation:none;perspective:600px}
h1.title .ch{display:inline-block;background:linear-gradient(90deg,var(--c3),#fff,var(--c1),var(--c2),var(--gold),var(--c3));background-size:600% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:chFlow 6s linear infinite,chBob 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.18s),calc(var(--i)*.09s);
  filter:drop-shadow(0 3px 0 rgba(124,92,255,.85)) drop-shadow(0 6px 0 rgba(60,20,120,.7)) drop-shadow(0 0 22px rgba(255,79,216,.45))}
h1.title .sp{display:inline-block;width:.28em}
@keyframes chFlow{to{background-position:600% 0}}
@keyframes chBob{0%,100%{transform:translateY(0) rotateX(0)}50%{transform:translateY(-6px) rotateX(14deg)}}

/* ---- class & name buttons ---- */
.cls-btn{isolation:isolate}
.cls-btn::before{content:"";position:absolute;inset:-50%;z-index:-1;background:conic-gradient(from 0deg,transparent,rgba(255,79,216,.5),transparent 30%,rgba(34,211,238,.5),transparent 60%);animation:spin 5s linear infinite;opacity:0;transition:opacity .3s}
.cls-btn::after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:20px;background:linear-gradient(160deg,#1a1442,#0d0a25)}
.cls-btn:hover::before,.cls-btn.on::before{opacity:1}
.cls-btn.on::after{background:linear-gradient(160deg,#3a1c6b,#251045)}
.cls-btn b{display:block;font-size:clamp(30px,5vw,44px);background:linear-gradient(180deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.name-btn{position:relative;overflow:hidden}
.name-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18),transparent 70%);transform:translateX(-120%);transition:transform .6s}
.name-btn:hover::after{transform:translateX(120%)}
.name-btn:hover{box-shadow:0 0 0 1px rgba(34,211,238,.6),0 10px 30px -10px rgba(34,211,238,.6)}

/* ---- mission cards: hologram ---- */
.mcard{border:0;background:#0d0a25}
.mcard .mborder{position:absolute;inset:0;z-index:-3;border-radius:26px;overflow:hidden}
.mcard .mborder::before{content:"";position:absolute;left:50%;top:50%;width:200%;height:200%;margin:-100% 0 0 -100%;background:conic-gradient(from 0deg,transparent 0 60%,var(--mc) 75%,#fff 80%,var(--mc) 85%,transparent 100%);animation:spin 4s linear infinite;opacity:.35;transition:opacity .3s}
.mcard:hover .mborder::before{opacity:1;animation-duration:2s}
.mcard .cover{inset:2px;border-radius:24px}
.mcard::before{inset:2px;border-radius:24px}
.mcard .holo{position:absolute;inset:2px;border-radius:24px;z-index:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 40%),
  repeating-linear-gradient(115deg,rgba(255,0,180,.18) 0 6%,rgba(0,220,255,.18) 6% 12%,rgba(255,230,0,.16) 12% 18%,rgba(120,80,255,.18) 18% 24%);
  background-size:100% 100%,300% 300%;background-position:0 0,var(--mx,50%) var(--my,50%)}
.mcard:hover .holo{opacity:.85}
.mcard > *:not(.cover):not(.mborder):not(.holo):not(.ico):not(.ring){position:relative;z-index:1}
.mcard .ico,.mcard .ring{z-index:2}
.mcard .ico{position:absolute;animation:bob 3s ease-in-out infinite;box-shadow:0 0 24px var(--mc)}
.mcard .ring{position:absolute}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.mcard{animation:cardIn .8s cubic-bezier(.2,1.2,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) rotateX(-40deg) translateY(60px) scale(.9)}to{opacity:1;transform:none}}
.topic-head h2{position:relative}
.topic-head h2::after{content:"";display:block;height:3px;margin-top:8px;border-radius:3px;background:linear-gradient(90deg,var(--c3),var(--c1),transparent);background-size:200% 100%;animation:shine 3s linear infinite;box-shadow:0 0 14px var(--c1)}
.exam-card h2{text-shadow:none}
.exam-card .trophy{font-size:clamp(50px,8vw,84px);filter:drop-shadow(0 0 30px rgba(255,209,102,.8));animation:bob 2.6s ease-in-out infinite;display:inline-block;margin-right:6px;vertical-align:middle}
#examBtn{animation:glowPulse 1.8s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 10px 30px -8px rgba(255,209,102,.6)}50%{box-shadow:0 0 0 8px rgba(255,209,102,.15),0 10px 50px -4px rgba(255,209,102,.95)}}

/* ---- play screen ---- */
.qcard{isolation:isolate;overflow:hidden;border:0;background:#0f0b2c}
.qcard::before{content:"";position:absolute;left:50%;top:50%;width:250%;height:250%;margin:-125% 0 0 -125%;z-index:-2;background:conic-gradient(from 0deg,var(--c3),var(--c2),var(--c1),var(--gold),var(--c3));animation:spin 8s linear infinite;opacity:.75}
.qcard::after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:20px;background:linear-gradient(160deg,#1b1546 0%,#0f0b2c 60%),#0f0b2c}
.qcard .scanline{position:absolute;left:0;right:0;height:120px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(34,211,238,.07),transparent);animation:scan 4s linear infinite}
@keyframes scan{from{top:-120px}to{top:100%}}
.prog{overflow:visible}
.prog i{position:relative}
.prog i::after{content:"";position:absolute;right:-6px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle,#fff,var(--c1) 50%,transparent 70%);box-shadow:0 0 20px var(--c1),0 0 40px var(--c1);animation:pulse 1s ease-in-out infinite}
.opt{transition:transform .2s cubic-bezier(.2,1.4,.3,1),border-color .2s,background .2s,box-shadow .2s}
.opt:hover:not(:disabled){box-shadow:0 12px 30px -12px rgba(34,211,238,.8)}
.opt.right{animation:rightPop .6s cubic-bezier(.2,1.6,.3,1);box-shadow:0 0 0 4px rgba(46,229,157,.25),0 0 40px rgba(46,229,157,.45)}
@keyframes rightPop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.shock{position:fixed;z-index:61;pointer-events:none;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:4px solid var(--ok);box-shadow:0 0 30px var(--ok),inset 0 0 20px var(--ok);animation:shock .8s cubic-bezier(.1,.8,.2,1) forwards}
@keyframes shock{to{transform:scale(22);opacity:0;border-width:1px}}
.stamp{position:fixed;left:50%;top:42%;z-index:62;pointer-events:none;font-weight:900;font-size:clamp(44px,9vw,110px);letter-spacing:-1px;white-space:nowrap;
  background:linear-gradient(180deg,#fff 10%,#b9ffe5 45%,var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #0b6b4a) drop-shadow(0 0 30px rgba(46,229,157,.8));animation:stamp 1.1s cubic-bezier(.2,1.5,.3,1) forwards}
.stamp.combo{background:linear-gradient(180deg,#fff 10%,#ffe7a8 45%,#ff9f1c);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #8a3b00) drop-shadow(0 0 34px rgba(255,159,28,.9))}
.stamp small{display:block;text-align:center;font-size:.32em;letter-spacing:4px}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(3) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}75%{transform:translate(-50%,-50%) scale(1.05) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-70%) scale(.9) rotate(-6deg);opacity:0}}
.screen-tint{position:fixed;inset:0;z-index:58;pointer-events:none;animation:tint .7s ease-out forwards}
.screen-tint.ok{background:radial-gradient(circle,transparent 40%,rgba(46,229,157,.35))}
.screen-tint.no{background:radial-gradient(circle,transparent 35%,rgba(255,92,122,.45))}
@keyframes tint{from{opacity:1}to{opacity:0}}
.glitch{animation:glitch .5s steps(2) 1}
@keyframes glitch{0%{transform:translate(0);filter:none}20%{transform:translate(-8px,2px) skewX(4deg);filter:drop-shadow(4px 0 0 rgba(255,0,80,.8)) drop-shadow(-4px 0 0 rgba(0,220,255,.8))}40%{transform:translate(7px,-2px) skewX(-3deg)}60%{transform:translate(-5px,1px);filter:drop-shadow(-3px 0 0 rgba(255,0,80,.8)) drop-shadow(3px 0 0 rgba(0,220,255,.8))}80%{transform:translate(3px,0)}100%{transform:none;filter:none}}
.lockin{animation:lockin .35s ease-out}
@keyframes lockin{0%{box-shadow:0 0 0 0 rgba(255,209,102,.7)}100%{box-shadow:0 0 0 24px rgba(255,209,102,0)}}

/* ---- countdown ---- */
.countdown{position:fixed;inset:0;z-index:140;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle,rgba(7,6,26,.55),rgba(7,6,26,.92))}
.countdown b{font-size:clamp(120px,30vw,300px);font-weight:900;background:linear-gradient(180deg,#fff,var(--gold) 60%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(255,209,102,.8));animation:cd .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes cd{0%{transform:scale(3);opacity:0}40%{transform:scale(1);opacity:1}100%{transform:scale(.6);opacity:0}}

/* ---- result ---- */
.result{position:relative;overflow:hidden;isolation:isolate}
.result .rays{position:absolute;left:50%;top:330px;width:1400px;height:1400px;margin:-700px 0 0 -700px;z-index:-1;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,209,102,.22) 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite;
  mask-image:radial-gradient(circle,#000 10%,transparent 55%);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 55%)}
.result .rays.fail{background:repeating-conic-gradient(from 0deg,rgba(124,92,255,.2) 0 6deg,transparent 6deg 18deg)}
.rank{font-size:clamp(14px,2.4vw,18px);letter-spacing:8px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,209,102,.8);animation:fadeUp .8s .3s both}
.trophy-big{font-size:clamp(60px,12vw,110px);display:inline-block;animation:trophyIn 1s cubic-bezier(.2,1.6,.3,1) both,bob 3s 1s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(255,209,102,.8))}
@keyframes trophyIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.bigring{filter:drop-shadow(0 0 30px rgba(124,92,255,.6))}
.breakdown .b{animation:pop .5s both}

body.lowfx #cursorGlow,body.lowfx .aurora,body.lowfx .beams,body.lowfx .glyphs,body.lowfx .orbit,body.lowfx .qcard .scanline,body.lowfx .result .rays,body.lowfx .mcard .holo{display:none}
body.lowfx .qcard::before,body.lowfx .mcard .mborder::before{animation:none}
body.lowfx h1.title .ch{animation:none;filter:none}
@media (prefers-reduced-motion:reduce){#intro,.stamp,.shock,.countdown{display:none!important}}

/* ================= FX LAYER 2: extra grandeur ================= */
/* floating 3D wireframe objects */
#floaters{position:fixed;inset:0;z-index:1;pointer-events:none;perspective:900px;overflow:hidden}
.cube{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:cubeSpin var(--d) linear infinite,floatY calc(var(--d)*.6) ease-in-out infinite alternate}
.cube i{position:absolute;inset:0;border:1.5px solid var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,transparent),transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.torus{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:cubeSpin var(--d) linear infinite reverse,floatY calc(var(--d)*.5) ease-in-out infinite alternate}
.torus i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 16px var(--c)}
.torus i:nth-child(2){transform:rotateY(60deg)}.torus i:nth-child(3){transform:rotateY(120deg)}
@keyframes cubeSpin{from{transform:rotateX(0) rotateY(0) rotateZ(0)}to{transform:rotateX(360deg) rotateY(720deg) rotateZ(360deg)}}
@keyframes floatY{from{translate:0 -30px}to{translate:0 40px}}
body.lowfx #floaters{display:none}

/* living buttons */
.btn{background-size:200% 200%!important;animation:btnFlow 6s ease infinite}
.btn.ghost{animation:none}
@keyframes btnFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn:not(.ghost):not(:disabled):hover{box-shadow:0 0 0 3px rgba(255,255,255,.18),0 16px 40px -8px rgba(255,79,216,.85)}

/* loading */
#scr-load .portal{width:200px;height:200px;filter:drop-shadow(0 0 30px rgba(255,79,216,.6))}
#scr-load .brand{font-size:16px;letter-spacing:6px;background:linear-gradient(90deg,var(--muted),#fff,var(--muted));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2s linear infinite}

/* HUD corner brackets */
.hud{position:relative}
.hud > .hc{position:absolute;width:26px;height:26px;pointer-events:none;z-index:3;border:3px solid var(--c3);filter:drop-shadow(0 0 6px var(--c3))}
.hud > .hc.tl{top:10px;left:10px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.hud > .hc.tr{top:10px;right:10px;border-left:0;border-bottom:0;border-top-right-radius:10px;border-color:var(--c1);filter:drop-shadow(0 0 6px var(--c1))}
.hud > .hc.bl{bottom:10px;left:10px;border-right:0;border-top:0;border-bottom-left-radius:10px;border-color:var(--c1);filter:drop-shadow(0 0 6px var(--c1))}
.hud > .hc.br{bottom:10px;right:10px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.hero.hud > .hc{animation:hcPulse 2.4s ease-in-out infinite}
@keyframes hcPulse{50%{opacity:.35}}

/* class buttons: planets */
.cls-btn{padding:30px 10px 24px}
.cls-btn .planet{display:block;width:58px;height:58px;margin:0 auto 8px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 30% 30%,#fff,var(--pc) 35%,#130b36 85%);box-shadow:0 0 30px var(--pc),inset -8px -8px 18px rgba(0,0,0,.5);animation:bob 4s ease-in-out infinite}
.cls-btn .planet::after{content:"";position:absolute;left:-30%;right:-30%;top:42%;height:16%;border-radius:50%;border:2px solid rgba(255,255,255,.55);transform:rotate(-18deg);box-shadow:0 0 12px rgba(255,255,255,.4)}
.cls-btn:hover .planet{animation-duration:1.2s}

/* names: avatar orbs */
.name-btn{padding:12px 16px;border-radius:18px}
.name-btn .no{position:relative;border-radius:50%;min-width:46px;height:46px;background:#120d33;isolation:isolate}
.name-btn .no::before{content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;background:conic-gradient(var(--c3),var(--c2),var(--c1),var(--gold),var(--c3));animation:spin 4s linear infinite}
.name-btn .no::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1;background:#140e38}
.name-btn:hover{transform:translateY(-3px) scale(1.02)}

/* topic watermark */
.topic-head{position:relative}
.topic-head::before{content:attr(data-t);position:absolute;right:2%;top:-60px;font-size:180px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(124,92,255,.22);pointer-events:none;z-index:-1}

/* play HUD */
.playbar{border:1px solid rgba(34,211,238,.35);box-shadow:0 0 0 1px rgba(255,79,216,.15),0 10px 40px -10px rgba(34,211,238,.45)}
.playbar .ttl{font-size:17px}
.prog{height:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 18px,rgba(255,255,255,.03) 18px 20px)}
.qtype .tbadge{background:linear-gradient(135deg,var(--c2),var(--c1));border:0;box-shadow:0 0 18px rgba(255,79,216,.5);color:#fff}
.qtext{text-shadow:0 2px 20px rgba(124,92,255,.35)}
.qnum{font-size:15px;padding:4px 12px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff}

/* options: neon tiles */
.opt{isolation:isolate;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.12);border-radius:20px;min-height:72px}
.opt::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;background:radial-gradient(circle at 0% 50%,rgba(34,211,238,.35),transparent 60%)}
.opt:hover:not(:disabled)::before,.opt.sel::before{opacity:1}
.opt .k{border-radius:50%;width:42px;height:42px;min-width:42px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(124,92,255,.5) 60%);box-shadow:0 0 14px rgba(124,92,255,.6);font-size:17px}
.opt:hover:not(:disabled){transform:translateY(-4px) scale(1.01)}
.opt.sel{background:linear-gradient(160deg,rgba(34,211,238,.25),rgba(124,92,255,.12))}
.opt.sel .k{background:radial-gradient(circle at 30% 30%,#fff,var(--c3) 60%);box-shadow:0 0 20px var(--c3)}
.chip{border-radius:16px;box-shadow:0 6px 16px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.chip:hover{box-shadow:0 0 0 2px rgba(34,211,238,.6),0 10px 20px -6px rgba(34,211,238,.6)}
.bub{box-shadow:0 10px 30px -12px rgba(0,0,0,.8)}
.bub.A{background:linear-gradient(135deg,rgba(124,92,255,.38),rgba(124,92,255,.14))}
.bub.B{background:linear-gradient(135deg,rgba(255,79,216,.32),rgba(255,79,216,.1))}
.tlwrap{background:radial-gradient(ellipse at 70% 50%,rgba(255,209,102,.08),transparent 60%),rgba(0,0,0,.35);box-shadow:inset 0 0 40px rgba(124,92,255,.2)}
.fb{position:relative;overflow:hidden}
.fb::after{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite}

/* modals: neon portal frame */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.modal{border:2px solid transparent;background:radial-gradient(ellipse at top,rgba(124,92,255,.35),transparent 60%) padding-box,linear-gradient(160deg,#1d1650,#0d0a25) padding-box,conic-gradient(from var(--ang),var(--c3),var(--c2),var(--c1),var(--gold),var(--c3)) border-box;animation:mIn .4s cubic-bezier(.2,.9,.3,1.2),angSpin 5s linear infinite;box-shadow:0 0 60px -10px rgba(124,92,255,.7),0 40px 100px -20px #000}
.warn-modal .modal{background:radial-gradient(ellipse at top,rgba(255,31,90,.35),transparent 60%) padding-box,linear-gradient(160deg,#3a0f22,#160818) padding-box,conic-gradient(from var(--ang),#ff1f5a,#ff8a00,#ff1f5a,#7c0033,#ff1f5a) border-box;animation:mIn .4s,angSpin 1.6s linear infinite}
@keyframes angSpin{to{--ang:360deg}}
.popmsg .bigmsg{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.18));box-shadow:inset 0 0 30px rgba(124,92,255,.3)}
.chat-fab::before{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid rgba(34,211,238,.6);animation:fabRing 2s ease-out infinite;pointer-events:none}
@keyframes fabRing{from{transform:scale(.95);opacity:1}to{transform:scale(1.25);opacity:0}}
.chat-panel{border:1px solid rgba(34,211,238,.45);box-shadow:0 0 40px -10px rgba(34,211,238,.6),0 30px 80px -20px #000}

/* exam card sparkle */
.exam-card .gold-dust{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.exam-card .gold-dust i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:dust linear infinite}
@keyframes dust{to{transform:translateY(-260px);opacity:0}}
.exam-card .sweep{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,230,160,.22) 50%,transparent 65%);background-size:250% 100%;animation:sweep2 4s ease-in-out infinite}
@keyframes sweep2{from{background-position:150% 0}to{background-position:-100% 0}}

/* result: orbiting particles around ring */
.bigring .orbitp{position:absolute;inset:-14px;border-radius:50%;animation:spin 6s linear infinite;pointer-events:none}
.bigring .orbitp::before,.bigring .orbitp::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 16px var(--c3),0 0 30px var(--c3)}
.bigring .orbitp::before{top:-6px;left:50%}.bigring .orbitp::after{bottom:-6px;left:50%;box-shadow:0 0 16px var(--c1),0 0 30px var(--c1)}
.bigring .val{text-shadow:0 0 30px rgba(124,92,255,.8)}

/* admin panel: mission-control look */
#admin{background:radial-gradient(ellipse at 20% -10%,#3b1d7a,transparent 50%),radial-gradient(ellipse at 90% 10%,#5a1252,transparent 45%),#07061a}
.adm-top{border-bottom:1px solid rgba(34,211,238,.35);box-shadow:0 10px 30px -15px rgba(34,211,238,.5)}
.tab.on{box-shadow:0 0 22px rgba(255,79,216,.6)}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(124,92,255,.22),rgba(255,255,255,.03));border:1px solid rgba(124,92,255,.35)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.35),transparent 70%)}
.stat b{font-size:34px;background:linear-gradient(180deg,#fff,#b9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(124,92,255,.6))}
.tbl th{background:linear-gradient(180deg,#221a55,#16113a)}
.set{background:linear-gradient(160deg,rgba(124,92,255,.14),rgba(255,255,255,.03))}
/* mission grid: max 3 per row, reserve room for the icon so long titles never overlap it */
.mgrid{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
@media(min-width:1000px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{padding-top:96px;min-height:270px}

/* ================= PERFORMANCE PASS: same look, GPU-cheap rendering (applies to every mode) ================= */
/* 1) no live blur anywhere: glass panels get a solid tinted background instead of backdrop-filter */
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.glass{background:linear-gradient(160deg,rgba(32,26,80,.92),rgba(16,12,44,.92))}
.modal-bg{background:rgba(4,3,15,.82)}
/* 2) colour blobs: pre-softened gradients, no filter, no blend mode; transform-only motion */
.blobs{filter:none;opacity:.6}
.blobs i{mix-blend-mode:normal;will-change:transform}
.blobs i:nth-child(1){background:radial-gradient(circle,rgba(124,92,255,.55) 0,rgba(124,92,255,.18) 35%,transparent 68%)}
.blobs i:nth-child(2){background:radial-gradient(circle,rgba(255,79,216,.45) 0,rgba(255,79,216,.15) 35%,transparent 68%)}
.blobs i:nth-child(3){background:radial-gradient(circle,rgba(34,211,238,.4) 0,rgba(34,211,238,.12) 35%,transparent 68%)}
/* 3) grid floor: static (it repainted a huge masked area every frame) */
.grid-floor{animation:none}
/* 4) hero aurora: no blur filter / blend; slow transform-only spin */
.hero .aurora{filter:none;mix-blend-mode:normal;opacity:.35;will-change:transform}
/* 5) title: one static gradient per letter + a single shadow on the whole word; letters only bob (transform) */
h1.title .ch{animation:chBob 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.09s);filter:none;background-position:calc(var(--i)*35%) 0;will-change:transform}
h1.title.fx-title{filter:none;position:relative;isolation:isolate}
h1.title.fx-title::before{content:"";position:absolute;left:8%;right:8%;top:10%;bottom:0;z-index:-1;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,79,216,.35),rgba(124,92,255,.18) 45%,transparent 70%);pointer-events:none}
h1.title .ch{-webkit-text-stroke:1px rgba(255,255,255,.18)}
/* 6) spinning conic borders only while hovered (they were 15+ big rotating layers) */
.mcard .mborder::before,.cls-btn::before,.name-btn .no::before{animation-play-state:paused}
.mcard:hover .mborder::before,.cls-btn:hover::before,.cls-btn.on::before,.name-btn:hover .no::before{animation-play-state:running}
.exam-card::after{width:150%;height:400%;left:-25%;top:-150%;margin:0;animation-duration:9s}
/* 7) buttons: static gradient; light sweep only on hover */
.btn{animation:none;background-size:100% 100%!important}
.btn::after{animation:none;left:-60%}
.btn:hover::after{animation:sweep 1s ease-out 1}
#examBtn{animation:none;box-shadow:0 0 0 6px rgba(255,209,102,.15),0 10px 40px -6px rgba(255,209,102,.85)}
/* 8) shimmering headings: static gradient (background-position animation repaints every frame) */
.grad-text,.topic-head h2::after{animation:none}
/* 9) floating 3D shapes: borders only (glow shadows on rotating faces were costly) */
.cube i,.torus i{box-shadow:none;background:none}
/* 10) question card: slower, smaller rotating border */
.qcard::before{width:180%;height:400%;margin:0;left:-40%;top:-150%;animation-duration:14s}
.mcard .holo{mix-blend-mode:normal}
.mcard:hover .holo{opacity:.45}
/* full-mode login page: keep the colour fields but stop moving the huge layers */
.blobs i{animation:none}
.hero .aurora{animation:none;inset:-10%}
#scr-hub .glyphs{display:none}

/* ================= "LITE" mode: tablets/phones — keeps the look, drops continuous GPU-heavy work ================= */
body.lite{background:radial-gradient(ellipse at 15% -5%,rgba(124,92,255,.45),transparent 45%),radial-gradient(ellipse at 95% 25%,rgba(255,79,216,.32),transparent 45%),radial-gradient(ellipse at 40% 110%,rgba(34,211,238,.28),transparent 50%),var(--bg);background-attachment:fixed}
body.lite .blobs,body.lite #floaters,body.lite .aurora,body.lite .beams,body.lite .glyphs,body.lite .orbit,body.lite .clock-halo,body.lite .qcard .scanline,body.lite .gold-dust,body.lite .exam-card .sweep,body.lite #cursorGlow{display:none!important}
body.lite .grid-floor{animation:none;opacity:.3}
body.lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.lite .glass{background:linear-gradient(160deg,#1d1748,#110d30)}
body.lite .hero::before{background:radial-gradient(ellipse at 50% 0%,rgba(124,92,255,.45),transparent 60%),linear-gradient(180deg,rgba(7,6,26,.1),rgba(7,6,26,.6))}
/* stop every infinite repaint-driven animation; keep static versions of the same glow */
body.lite .btn,body.lite .btn::after,body.lite .grad-text,body.lite .topic-head h2::after,body.lite #examBtn,body.lite .cls-btn::before,body.lite .mcard .mborder::before,
body.lite .qcard::before,body.lite .exam-card::after,body.lite .name-btn .no::before,body.lite .result .rays,body.lite .mcard .ico,body.lite .cls-btn .planet,
body.lite .exam-card .trophy,body.lite .fb::after,body.lite .clock .r1,body.lite .clock .r2,body.lite .clock .hand,body.lite .clock .hand2,body.lite .hero.hud > .hc,body.lite .marquee span{animation:none!important}
body.lite .marquee span{padding-left:0;white-space:normal;display:block;text-align:center;padding:0 14px}
body.lite .mcard .mborder::before{opacity:.75}
body.lite .cls-btn::before{opacity:.8}
body.lite .btn::after{display:none}
body.lite h1.title .ch{animation:none!important;background-position:calc(var(--i)*40%) 0;filter:none}
body.lite .modal,body.lite .warn-modal .modal{animation:mIn .35s cubic-bezier(.2,.9,.3,1.2)!important}
body.lite .mcard:hover .holo{opacity:0}
body.lite .bigring{filter:none}
body.lite #examBtn{box-shadow:0 0 0 6px rgba(255,209,102,.15),0 10px 40px -6px rgba(255,209,102,.85)}

</style>

var AC = {
  on:false, lenient:false, count:0, limit:0, mode:'', hiddenAt:0, blurT:null, mo:null, fs:false, bound:false,
  start:function(mode){
    this.mode = mode; this.count = GAME.violations || 0;
    this.on = on(mode === 'exam' ? 'acExam' : 'acPractice');
    this.lenient = this.on && IS_IOS && on('ipadLenient');
    this.limit = mode === 'exam' ? Number(S('violationLimit') || 0) : 0;
    if (!this.bound) this.bind();
    if (this.on){
      var q = $('#scr-play');
      if (this.mo) this.mo.disconnect();
      this.mo = new MutationObserver(function(muts){ if (!AC.on) return; for (var i = 0; i < muts.length; i++) if (muts[i].type === 'characterData'){ AC.hit('แปลภาษาอัตโนมัติ'); break; } });
      this.mo.observe(q, {subtree:true, characterData:true});
      if (mode === 'exam' && !IS_IOS) this.enterFs();
    }
  },
  stop:function(){ this.on = false; if (this.mo) this.mo.disconnect(); this.mo = null; this.exitFs(); var b = $('.fs-block'); if (b) b.remove(); },
  refresh:function(){ if (!GAME.active) return; var was = this.on; this.on = on(this.mode === 'exam' ? 'acExam' : 'acPractice'); this.lenient = this.on && IS_IOS && on('ipadLenient'); this.limit = this.mode === 'exam' ? Number(S('violationLimit') || 0) : 0; if (was && !this.on) this.stop(); updateVPill(); },
  enterFs:function(){ var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen; if (f){ try { var p = f.call(d); this.fs = true; if (p && p.catch) p.catch(function(){ AC.fs = false; }); } catch(e){ this.fs = false; } } },
  exitFs:function(){ var fe = document.fullscreenElement || document.webkitFullscreenElement; if (fe){ try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e){} } this.fs = false; },
  bind:function(){
    this.bound = true;
    document.addEventListener('visibilitychange', function(){
      if (!AC.on || !GAME.active) return;
      if (document.hidden){ AC.hiddenAt = Date.now(); if (!AC.lenient) AC.hit('สลับแท็บ/ออกจากหน้าจอ'); }
      else if (AC.lenient && AC.hiddenAt && Date.now() - AC.hiddenAt > 3000) AC.hit('ออกจากหน้าจอนานเกิน 3 วินาที');
    });
    window.addEventListener('blur', function(){
      if (!AC.on || !GAME.active || AC.lenient) return;
      clearTimeout(AC.blurT);
      AC.blurT = setTimeout(function(){ if (!document.hasFocus() && !document.hidden) AC.hit('คลิกออกนอกหน้าต่าง'); }, 1500);
    });
    window.addEventListener('focus', function(){ clearTimeout(AC.blurT); });
    ['copy', 'cut', 'paste'].forEach(function(ev){ document.addEventListener(ev, function(e){ if (AC.on && GAME.active && !(e.target.closest && e.target.closest('.chat-in,.popmsg'))){ e.preventDefault(); toast('🚫 ไม่อนุญาตให้คัดลอก/วาง', 'err'); } }); });
    document.addEventListener('contextmenu', function(e){ if (AC.on && GAME.active && !AC.lenient) e.preventDefault(); });
    document.addEventListener('keydown', function(e){
      if (!AC.on || !GAME.active) return;
      var k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
      if (k === 'printscreen' || k === 'f12' || (mod && e.shiftKey && (k === 'i' || k === 'j' || k === 's')) || (mod && (k === 'u' || k === 'p'))){ e.preventDefault(); AC.hit('กดปุ่มต้องห้าม (' + e.key + ')'); }
      else if (mod && (k === 'c' || k === 'v' || k === 'x') && !(e.target.closest && e.target.closest('.chat-in,.popmsg'))){ e.preventDefault(); }
    });
    var fsch = function(){ var fe = document.fullscreenElement || document.webkitFullscreenElement;
      if (AC.on && GAME.active && AC.mode === 'exam' && AC.fs && !fe){ AC.hit('ออกจากโหมดเต็มจอ'); AC.blockFs(); } };
    document.addEventListener('fullscreenchange', fsch); document.addEventListener('webkitfullscreenchange', fsch);
  },
  blockFs:function(){
    if ($('.fs-block')) return;
    var d = document.createElement('div'); d.className = 'fs-block';
    d.innerHTML = '<div><div style="font-size:60px">🛡️</div><h2>กรุณากลับเข้าสู่โหมดเต็มจอ</h2><p>การออกจากโหมดเต็มจอถูกบันทึกเป็นการทุจริต</p><button class="btn gold" id="backFs">กลับเข้าเต็มจอ</button></div>';
    document.body.appendChild(d); $('#backFs').onclick = function(){ AC.enterFs(); d.remove(); };
  },
  hit:function(kind){
    if (!GAME.active) return;
    this.count++; GAME.violations = this.count; saveExamState();
    SFX.alarm(); var f = document.createElement('div'); f.className = 'vflash'; document.body.appendChild(f); setTimeout(function(){ f.remove(); }, 1300);
    updateVPill();
    api('violation', {key:APP.me.key, kind:kind, count:this.count});
    var lim = this.limit;
    if (lim > 0 && this.count >= lim && GAME.mode === 'exam'){
      modal('<h3>⛔ ส่งข้อสอบอัตโนมัติ</h3><p>ตรวจพบการทุจริตครบ ' + lim + ' ครั้ง ระบบส่งข้อสอบให้แล้ว และแจ้งครูเรียบร้อย</p><div class="row"><button class="btn" data-close>รับทราบ</button></div>', {cls:'warn-modal'});
      finishGame('violation'); return;
    }
    if (!$('.warn-modal')) modal('<div style="text-align:center"><div style="font-size:56px">🚨</div><h3>ตรวจพบพฤติกรรมเสี่ยงทุจริต</h3><p style="font-size:17px">' + esc(kind) + '<br>ครั้งที่ <b>' + this.count + '</b>' + (lim > 0 && GAME.mode === 'exam' ? ' / ' + lim + ' (ครบแล้วส่งอัตโนมัติ)' : '') + '</p><p style="color:var(--muted)">ระบบแจ้งครูโอ๊ตแล้ว</p><div class="row" style="justify-content:center"><button class="btn red" data-close>รับทราบ จะไม่ทำอีก</button></div></div>', {cls:'warn-modal', dismiss:false});
  }
};

var FaceScan = {
  run:function(){
    return new Promise(function(resolve){
      var circ = 2 * Math.PI * 48;
      var m = modal('<h3 style="text-align:center">📷 สแกนใบหน้าก่อนสอบ</h3><p style="text-align:center;color:var(--muted);margin:0">มองกล้อง ให้ใบหน้าอยู่ในวงกลม ในที่ที่มีแสงสว่าง</p>' +
        '<div class="scan-wrap"><div class="scan"><video id="fsv" playsinline muted autoplay></video><div class="beam"></div></div>' +
        '<div class="scan-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="2"/><circle id="fsr" cx="50" cy="50" r="48" fill="none" stroke="#2ee59d" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 ' + circ + '"/></svg></div></div>' +
        '<div class="scan-msg" id="fsm">กำลังเปิดกล้อง…</div>' +
        '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--muted)">กล้องใช้ไม่ได้? ใช้รหัสจากครู</summary><div style="display:flex;gap:8px;margin-top:10px"><input class="input" id="fsc" inputmode="numeric" placeholder="รหัสจากครู"><button class="btn sm" id="fscb">ยืนยัน</button></div></details>' +
        '<div class="row"><button class="btn ghost" id="fsx">ยกเลิก</button></div>', {dismiss:false});
      var video = $('#fsv', m), msg = $('#fsm', m), ring = $('#fsr', m), stream = null, stopped = false, prog = 0, det = null;
      function end(r){ stopped = true; if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); m.remove(); resolve(r); }
      $('#fsx', m).onclick = function(){ end(null); };
      $('#fscb', m).onclick = function(){ var code = $('#fsc', m).value.trim(); if (!code) return; this.disabled = true; var b = this;
        api('faceCode', {code:code, key:APP.me.key}).then(function(r){ b.disabled = false; if (r.ok){ SFX.ok(); end({method:'code'}); } else { SFX.bad(); toast('รหัสไม่ถูกต้อง', 'err'); } }); };
      if ('FaceDetector' in window){ try { det = new window.FaceDetector({fastMode:true, maxDetectedFaces:1}); } catch(e){ det = null; } }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg.textContent = '⚠️ อุปกรณ์นี้เปิดกล้องไม่ได้ — กรุณาใช้รหัสจากครู'; $('details', m).open = true; return; }
      navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:480}, height:{ideal:480}}, audio:false}).then(function(s){
        stream = s; video.srcObject = s; var pr = video.play(); if (pr && pr.catch) pr.catch(function(){});
        msg.textContent = 'กำลังตรวจจับใบหน้า…'; loop();
      }).catch(function(){ msg.innerHTML = '⚠️ ไม่ได้รับอนุญาตให้ใช้กล้อง<br><small>อนุญาตกล้องในเบราว์เซอร์ หรือใช้รหัสจากครู</small>'; $('details', m).open = true; });
      var cv = document.createElement('canvas'), g = cv.getContext('2d', {willReadFrequently:true});
      function heuristic(){
        var w = 96, h = 96; cv.width = w; cv.height = h; g.drawImage(video, 0, 0, w, h);
        var d = g.getImageData(0, 0, w, h).data, skin = 0, tot = 0, sum = 0, sum2 = 0;
        for (var y = 0; y < h; y += 2) for (var x = 0; x < w; x += 2){
          var dx = (x - w / 2) / (w * .32), dy = (y - h / 2) / (h * .42); if (dx * dx + dy * dy > 1) continue;
          var i = (y * w + x) * 4, R = d[i], G = d[i + 1], B = d[i + 2];
          var Y = .299 * R + .587 * G + .114 * B, Cb = 128 - .168736 * R - .331264 * G + .5 * B, Cr = 128 + .5 * R - .418688 * G - .081312 * B;
          tot++; sum += Y; sum2 += Y * Y; if (Cb > 77 && Cb < 135 && Cr > 130 && Cr < 180 && Y > 40) skin++;
        }
        var mean = sum / tot, sd = Math.sqrt(Math.max(0, sum2 / tot - mean * mean));
        return skin / tot > .28 && sd > 14 && mean > 45;
      }
      function check(){
        if (det) return det.detect(video).then(function(f){ return f.length > 0; }).catch(function(){ det = null; return heuristic(); });
        return Promise.resolve(heuristic());
      }
      function loop(){
        if (stopped) return;
        if (video.readyState < 2){ setTimeout(loop, 200); return; }
        check().then(function(okFace){
          if (stopped) return;
          prog = okFace ? Math.min(100, prog + 9) : Math.max(0, prog - 12);
          ring.setAttribute('stroke-dasharray', (circ * prog / 100).toFixed(1) + ' ' + circ);
          msg.textContent = okFace ? (prog >= 100 ? '✅ ยืนยันตัวตนสำเร็จ' : 'พบใบหน้า… อยู่นิ่ง ๆ ' + prog + '%') : 'ยังไม่พบใบหน้า — ขยับเข้าใกล้กล้อง/หาที่สว่าง';
          if (prog >= 100){
            var c2 = document.createElement('canvas'); c2.width = 160; c2.height = 120; var g2 = c2.getContext('2d');
            var vw = video.videoWidth || 480, vh = video.videoHeight || 480, sc = Math.max(160 / vw, 120 / vh);
            g2.translate(160, 0); g2.scale(-1, 1); g2.drawImage(video, (160 - vw * sc) / 2, (120 - vh * sc) / 2, vw * sc, vh * sc);
            var img = ''; try { img = c2.toDataURL('image/jpeg', .6); } catch(e){}
            SFX.ok(); setTimeout(function(){ end({method:det ? 'face' : 'camera', img:img}); }, 500); return;
          }
          setTimeout(loop, 160);
        });
      }
    });
  }
};
